# CHOTU service stack. Pick a profile:
#   docker compose -f docker/docker-compose.yml --profile dev up -d           # dev shell (GUI + GPU)
#   docker compose -f docker/docker-compose.yml --profile sim up              # Gazebo AtomQuest room
#   docker compose -f docker/docker-compose.yml --profile robot up -d         # on the Raspberry Pi 4
# Images carry explicit versions (CHOTU_VERSION) - never deploy :latest to a robot.
name: chotu

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

services:
  dev:
    profiles: ["dev"]
    build: { context: .., dockerfile: docker/Dockerfile, target: dev, args: { ROS_DISTRO: "${ROS_DISTRO:-humble}" } }
    image: chotu/dev:${CHOTU_VERSION:-3.0.0}
    network_mode: host           # simplest reliable DDS discovery
    ipc: host
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg      # WSLg on Windows 11 (harmless elsewhere if present)
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  sim:
    profiles: ["sim"]
    image: chotu/dev:${CHOTU_VERSION:-3.0.0}
    build: { context: .., dockerfile: docker/Dockerfile, target: dev }
    network_mode: host
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -c "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
               cd /workspace/ros2_ws && colcon build --symlink-install &&
               source install/setup.bash &&
               ros2 launch chotu_bringup sim.launch.py vision:=false rviz:=true"

  robot:
    profiles: ["robot"]
    build: { context: .., dockerfile: docker/Dockerfile, target: runtime }
    image: ${REGISTRY:-chotu}/runtime:${CHOTU_VERSION:-3.0.0}
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *ros-env
    devices:                     # explicit hardware contract - no --privileged
      - ${CHOTU_ESP32_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0   # ESP32-S3 base controller (udev symlink /dev/chotu_esp32 recommended)
      - /dev/video0:/dev/video0     # Pi camera (libcamera v4l2 compat) / USB webcam
    group_add: [dialout, video]
    # camera driver runs here, YOLO runs in the perception container below
    command: ["ros2", "launch", "chotu_bringup", "robot.launch.py", "vision:=false", "camera:=true", "auto_start:=false"]

  perception:
    profiles: ["robot", "gpu"]
    build: { context: .., dockerfile: docker/Dockerfile, target: perception }
    image: ${REGISTRY:-chotu}/perception:${CHOTU_VERSION:-3.0.0}
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *ros-env
    volumes:
      - ../models:/opt/chotu/models:ro
    # Pi 4: NCNN export (CPU). On the RTX 3060 (gpu profile) set CHOTU_YOLO_WEIGHTS=.../chotu_suck_avoid_yolov8n.pt
    # and CHOTU_YOLO_DEVICE=0.
    command: ["ros2", "run", "chotu_perception", "yolo_detector_node", "--ros-args",
              "--params-file", "/opt/chotu/install/share/chotu_bringup/config/chotu_params.yaml",
              "-p", "weights:=${CHOTU_YOLO_WEIGHTS:-/opt/chotu/models/chotu_suck_avoid_yolov8n_ncnn_model}",
              "-p", "device:=${CHOTU_YOLO_DEVICE:-cpu}"]
