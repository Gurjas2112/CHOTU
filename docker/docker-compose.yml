# CHOTU service stack. Pick a profile:
#   docker compose -f docker/docker-compose.yml --profile dev up -d           # dev shell (GUI + GPU)
#   docker compose -f docker/docker-compose.yml --profile sim up              # Gazebo AtomQuest room
#   docker compose -f docker/docker-compose.yml --profile twin up             # headless digital-twin benchmark
#   docker compose -f docker/docker-compose.yml --profile robot up -d         # on the Raspberry Pi 4
# Images carry explicit versions (CHOTU_VERSION) - never deploy :latest to a robot.
name: chotu

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp

services:
  dev:
    profiles: ["dev"]
    build: { context: .., dockerfile: docker/Dockerfile, target: dev, args: { ROS_DISTRO: "${ROS_DISTRO:-humble}" } }
    image: chotu/dev:${CHOTU_VERSION:-2.0.0}
    network_mode: host           # simplest reliable DDS discovery
    ipc: host
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg      # WSLg on Windows 11 (harmless elsewhere if present)
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  sim:
    profiles: ["sim"]
    image: chotu/dev:${CHOTU_VERSION:-2.0.0}
    build: { context: .., dockerfile: docker/Dockerfile, target: dev }
    network_mode: host
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -c "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
               cd /workspace/ros2_ws && colcon build --symlink-install &&
               source install/setup.bash &&
               ros2 launch chotu_bringup sim.launch.py vision:=false rviz:=true"

  twin:
    profiles: ["twin"]
    build: { context: .., dockerfile: docker/Dockerfile.sim }
    image: chotu/twin:${CHOTU_VERSION:-2.0.0}
    volumes:
      - ../bot_simulation/simulation_screenshot_screen_recording:/app/bot_simulation/simulation_screenshot_screen_recording
    command: ["python", "bot_simulation/run_simulation.py", "--benchmark", "20", "--headless",
              "--json", "bot_simulation/simulation_screenshot_screen_recording/benchmark_20_rooms.json"]

  robot:
    profiles: ["robot"]
    build: { context: .., dockerfile: docker/Dockerfile, target: runtime }
    image: ${REGISTRY:-chotu}/runtime:${CHOTU_VERSION:-2.0.0}
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *ros-env
    devices:                     # explicit hardware contract - no --privileged
      - /dev/ttyUSB0:/dev/ttyUSB0   # ESP32-S3 base controller
      - /dev/video0:/dev/video0     # Pi camera (libcamera v4l2 compat) / USB webcam
    group_add: [dialout, video]
    command: ["ros2", "launch", "chotu_bringup", "robot.launch.py", "vision:=false", "auto_start:=false"]

  perception:
    profiles: ["robot", "gpu"]
    build: { context: .., dockerfile: docker/Dockerfile, target: perception }
    image: ${REGISTRY:-chotu}/perception:${CHOTU_VERSION:-2.0.0}
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *ros-env
    volumes:
      - ../models:/opt/chotu/models:ro
