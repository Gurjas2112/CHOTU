; CHOTU base controller - PlatformIO project
;   pio run -e esp32s3                 build
;   pio run -e esp32s3 -t upload       flash (USB-UART port of the DevKitC-1)
;   pio device monitor -b 115200       raw link (binary COBS frames)

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X@^1.3.1
build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

[env:esp32s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17 (main.cpp also supports core 3.x)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0       ; Serial = UART0 -> USB-UART bridge -> Raspberry Pi /dev/ttyUSB0
    -DBOARD_HAS_PSRAM
upload_speed = 921600
