name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-core-and-pcb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && pip install -e .
      # autonomy, protocol, mapping/planning, behaviour + PCB-vs-firmware pin check (no SKiDL needed)
      - run: python -m pytest tests -q

  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  mobile-app:
    runs-on: ubuntu-22.04
    defaults:
      run: { working-directory: mobile_app/chotu_app }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.16.9", channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests (g++)
        run: make -C firmware/esp32s3_base_controller/test_host
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PlatformIO build (ESP32-S3)
        run: |
          pip install platformio
          pio run -d firmware/esp32s3_base_controller -e esp32s3

  ros2-humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-pip python3-pytest
          pip3 install -e .
          rosdep update && rosdep install --from-paths ros2_ws/src --ignore-src -y
      - name: colcon build + test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build
          colcon test --packages-select chotu_base
          colcon test-result --verbose
